{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset Complete — NLL RFID System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F7FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }

    .card-box {
      width: 100%; max-width: 440px; background: #fff; border: 1.5px solid #CCC;
      border-radius: 12px; padding: 36px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    .icon-wrap {
      width: 56px; height: 56px; border-radius: 50%; background: rgba(0,208,132,0.12);
      border: 2px solid #00D084; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px; color: #00A066;
    }
    .card-title { font-size: 22px; font-weight: 800; color: #001F4D; margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: #6B7280; line-height: 1.6; margin-bottom: 24px; }

    .btn-return {
      display: inline-block; padding: 11px 24px; background: #001F4D; color: #fff;
      font-size: 13px; font-weight: 700; border-radius: 6px; transition: background 0.15s;
    }
    .btn-return:hover { background: #002D6E; }
  </style>
</head>
<body>

  <div class="card-box">
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1 class="card-title">Password Successfully Reset</h1>
    <p class="card-desc">Your password has been changed successfully. You can now log into your account with your new credentials.</p>

    <a href="{% url 'login' %}" class="btn-return">Sign In Now</a>
  </div>

</body>
</html>
