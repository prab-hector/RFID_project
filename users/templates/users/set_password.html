{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password — NLL RFID System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F7FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }

    .card-box {
      width: 100%; max-width: 460px; background: #fff; border: 1.5px solid #CCC;
      border-radius: 12px; padding: 36px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .card-title { font-size: 22px; font-weight: 800; color: #001F4D; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #6B7280; line-height: 1.5; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
      color: #111827; background: #fff; border: 1.5px solid #CCC; border-radius: 6px;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus { border-color: #001F4D; box-shadow: 0 0 0 3px rgba(0,31,77,0.1); }
    .form-group .help-block, .form-group .form-text { font-size: 11px; color: #6B7280; margin-top: 4px; }

    .btn-submit {
      width: 100%; padding: 12px; background: #001F4D; color: #fff;
      font-size: 13px; font-weight: 700; border: none; border-radius: 6px;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(0,31,77,0.25); margin-top: 12px;
    }
    .btn-submit:hover { background: #002D6E; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div class="card-box">
    <h1 class="card-title">Set Account Password</h1>
    <p class="card-desc">Please set a secure password to activate and complete your RFID account.</p>

    <form method="POST">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn-submit">Save Password & Continue</button>
    </form>
  </div>

</body>
</html>
