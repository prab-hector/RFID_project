{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — NLL RFID System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F7FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }

    .card-box {
      width: 100%; max-width: 440px; background: #fff; border: 1.5px solid #CCC;
      border-radius: 12px; padding: 36px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    .logo-icon-wrap {
      width: 54px; height: 54px; border-radius: 50%; background: #001F4D;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
      box-shadow: 0 4px 12px rgba(0,31,77,0.2);
    }
    .card-title { font-size: 22px; font-weight: 800; color: #001F4D; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #6B7280; line-height: 1.5; margin-bottom: 24px; }

    .form-group { text-align: left; margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
      color: #111827; background: #fff; border: 1.5px solid #CCC; border-radius: 6px;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: #001F4D; box-shadow: 0 0 0 3px rgba(0,31,77,0.1); }

    .btn-submit {
      width: 100%; padding: 11px; background: #001F4D; color: #fff;
      font-size: 13px; font-weight: 700; border: none; border-radius: 6px;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(0,31,77,0.25);
    }
    .btn-submit:hover { background: #002D6E; transform: translateY(-1px); }

    .footer-link-wrap { margin-top: 20px; padding-top: 16px; border-top: 1px solid #EAECF0; font-size: 13px; }
    .link-blue { color: #0077CC; font-weight: 600; }
    .link-blue:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card-box">
    <div class="logo-icon-wrap">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="card-title">Reset Password</h1>
    <p class="card-desc">Enter your registered email address below, and we'll send you instructions to reset your password.</p>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email Address</label>
        <input class="form-input" type="email" name="email" id="id_email" placeholder="name@example.com" required autocomplete="email" />
      </div>

      <button type="submit" class="btn-submit">Send Reset Link</button>
    </form>

    <div class="footer-link-wrap">
      <a href="{% url 'login' %}" class="link-blue">← Back to Login</a>
    </div>
  </div>

</body>
</html>
